framework:
    rate_limiter:
        two_per_minute:
            policy: 'fixed_window'
            limit: 2
            interval: '1 minute'
        five_per_hour:
            policy: 'fixed_window'
            limit: 5
            interval: '1 hour'
        product_list_route:
            policy: 'compound'
            limiters: [two_per_minute, five_per_hour]
        create_route:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'
